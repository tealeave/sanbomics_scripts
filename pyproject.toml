[project]
name = "sanbomics-scripts"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.6.0",
    "torchvision",
    "torchaudio",
    "scanpy>=1.11.3",
    "scvi-tools[cuda]>=1.3.2",
    "ipykernel>=6.29.5",
    "leidenalg>=0.10.2",
    "scikit-misc>=0.5.1",
    "seaborn>=0.13.2",
]

[tool.uv.sources]
torch = { index = "pytorch-cuda-124" }
torchvision = { index = "pytorch-cuda-124" }
torchaudio = { index = "pytorch-cuda-124" }

[[tool.uv.index]]
name = "pytorch-cuda-124"
url = "https://download.pytorch.org/whl/cu124"